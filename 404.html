    <title>Página não encontrada — Sociedade Ativa</title>
    <meta name="description" content="Página não encontrada no portal Sociedade Ativa. Retorne à página inicial para acessar notícias, eleições e dados públicos do Brasil." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Tratamento inteligente de rotas profundas no GitHub Pages
      // Redireciona para o portal passando o caminho via query param para restauração pelo cliente
      (function() {
        var path = window.location.pathname;
        if (path && path !== "/" && path !== "/index.html") {
          window.location.replace("/?p=" + encodeURIComponent(path) + (window.location.hash || ""));
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        max-width: 480px;
        width: 100%;
        padding: 36px 32px;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      }
      .logo {
        width: 44px;
        height: 44px;
        background: #2563eb;
        color: white;
        font-weight: 900;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        font-weight: 900;
        margin: 0 0 10px 0;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      a {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 10px 24px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        transition: background 0.2s;
      }
      a:hover {
        background: #1d4ed8;
      }
    </style>
  </head>

    <div class="card">
