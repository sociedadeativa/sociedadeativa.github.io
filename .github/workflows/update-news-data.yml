name: Update Official News Data

on:
  schedule:
    # Horário Oficial de Brasília (BRT = UTC-3):
    # Execuções a cada 2h30 ao longo do expediente jornalístico brasileiro (06:00 às 21:00 BRT):
    # 09:00 UTC -> 06:00 BRT (primeira edição matutina)
    # 11:30 UTC -> 08:30 BRT (abertura dos mercados e expediente oficial)
    # 14:00 UTC -> 11:00 BRT (divulgações matinais do IBGE e pautas ministeriais)
    # 16:30 UTC -> 13:30 BRT (início das sessões plenárias na Câmara e Senado)
    # 19:00 UTC -> 16:00 BRT (divulgações da tarde, Banco Central e indicadores)
    # 21:30 UTC -> 18:30 BRT (fechamento dos trabalhos legislativos e mercados)
    # 00:00 UTC -> 21:00 BRT (resumo noturno final do dia)
    - cron: '0 9,14,19,0 * * *'
    - cron: '30 11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "news-data-update"
  cancel-in-progress: false

jobs:
  update-news-data:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit_step.outputs.has_changes }}
      commit_sha: ${{ steps.commit_step.outputs.commit_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ingest and Validate Official Brazilian Public News
        run: node scripts/update-news-data.mjs

      - name: Validate Generated News Dataset and Synchronization
        run: |
          if [ ! -s "public/data/newsData.json" ]; then
            echo "ERRO CRÍTICO: public/data/newsData.json está ausente ou vazio!"
            exit 1
          fi
          if [ ! -s "src/data/newsData.ts" ]; then
            echo "ERRO CRÍTICO: src/data/newsData.ts está ausente ou vazio!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("public/data/newsData.json", "utf8"));
            if (!Array.isArray(data) || data.length < 10) {
              console.error("Validação falhou: dataset insuficiente (< 10 artigos)");
              process.exit(1);
            }
            const tsContent = fs.readFileSync("src/data/newsData.ts", "utf8");
            const match = tsContent.match(/export const OFFICIAL_NEWS_ARTICLES: NewsItem\[\] = (\[[\s\S]*\]);/);
            if (!match) {
              console.error("Validação falhou: src/data/newsData.ts não possui array OFFICIAL_NEWS_ARTICLES válido");
              process.exit(1);
            }
            const tsArticles = JSON.parse(match[1]);
            if (tsArticles.length !== data.length) {
              console.error("Validação falhou: divergência entre newsData.json (" + data.length + ") e newsData.ts (" + tsArticles.length + ")");
              process.exit(1);
            }
            const seenIds = new Set();
            for (const item of data) {
              if (!item.id || !item.title || !item.summary || !item.source || !item.articleUrl || !item.publishedAt || !item.category) {
                console.error("Validação falhou: campos obrigatórios ausentes:", item);
                process.exit(1);
              }
              if (!item.articleUrl.startsWith("https://")) {
                console.error("Validação falhou: URL não é HTTPS:", item.articleUrl);
                process.exit(1);
              }
              if (!/^\d{2}\/\d{2}\/\d{4} às \d{2}:\d{2}$/.test(item.publishedAt)) {
                console.error("Validação falhou: formato de publishedAt inválido:", item.publishedAt);
                process.exit(1);
              }
              if (item.ingestedAt && !/^\d{2}\/\d{2}\/\d{4} às \d{2}:\d{2}$/.test(item.ingestedAt)) {
                console.error("Validação falhou: formato de ingestedAt inválido:", item.ingestedAt);
                process.exit(1);
              }
              if (seenIds.has(item.id)) {
                console.error("Validação falhou: ID duplicado detectado:", item.id);
                process.exit(1);
              }
              seenIds.add(item.id);
            }
            console.log("Validação de integridade aprovada: " + data.length + " artigos em total paridade entre JSON e TS.");
          '

      - name: Type Check and Lint
        run: npm run lint

      - name: Production Build Verification
        run: npm run build

      - name: Commit and Push if Changes Exist
        id: commit_step
        run: |
          git config user.name "Sociedade Ativa DataBot"
          git config user.email "bot@sociedadeativa.org"

          git add public/data/newsData.json public/sitemap.xml public/sitemap.txt src/data/newsData.ts

          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração nas notícias oficiais. Nenhuma ação necessária."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Alterações detectadas nas notícias oficiais. Efetuando commit..."
            git commit -m "data(noticias): atualização automática das notícias oficiais e sitemap [skip ci]"
            git pull --rebase origin main || true
            git push
            NEW_SHA=$(git rev-parse HEAD)
            echo "commit_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
            echo "Novo commit publicado para deploy: $NEW_SHA"
          fi

  deploy-pages:
    name: Deploy Updated News to GitHub Pages
    needs: update-news-data
    if: needs.update-news-data.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update-news-data.outputs.commit_sha || 'main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
