name: Update Official Economic Data

on:
  schedule:
    # 07:00 BRT (10:00 UTC) - Abertura matinal e indicadores oficiais IBGE/BCB
    - cron: '0 10 * * *'
    # Pregão B3 (10h00 às 17h55 BRT = 13h00 às 20h55 UTC, seg a sex):
    # Executa a cada 30 minutos durante o pregão oficial para atualizar cotações com defasagem de 15 min
    - cron: '*/30 13-20 * * 1-5'
    # 18:30 BRT (21:30 UTC) - Fechamento oficial consolidado da sessão B3
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "economic-data-update"
  cancel-in-progress: false

jobs:
  update-economic-data:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit_step.outputs.has_changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Fetch and Validate Official Economic Indicators
        run: node scripts/update-economic-data.mjs

      - name: Validate Generated Datasets
        run: |
          if [ ! -s "public/data/economyData.json" ]; then
            echo "ERRO CRÍTICO: public/data/economyData.json está ausente ou vazio!"
            exit 1
          fi
          if [ ! -s "public/data/economicData.json" ]; then
            echo "ERRO CRÍTICO: public/data/economicData.json está ausente ou vazio!"
            exit 1
          fi
          if [ ! -s "public/data/marketData.json" ]; then
            echo "ERRO CRÍTICO: public/data/marketData.json está ausente ou vazio!"
            exit 1
          fi
          echo "Validação dos arquivos JSON de economia e mercado concluída com sucesso."

      - name: Commit and Push if Changes Exist
        id: commit_step
        run: |
          git config user.name "Sociedade Ativa DataBot"
          git config user.email "bot@sociedadeativa.org"

          git add public/data/economyData.json public/data/economicData.json public/data/marketData.json src/data/marketData.ts src/data/economyData.ts


          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração nos indicadores econômicos oficiais. Nenhuma ação necessária."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Alterações detectadas nas séries oficiais. Efetuando commit..."
            git commit -m "data(economia): atualização automática dos indicadores oficiais [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

  deploy-pages:
    name: Deploy Updated Economic Data to GitHub Pages
    needs: update-economic-data
    if: needs.update-economic-data.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
