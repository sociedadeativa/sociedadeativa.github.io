name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref or commit SHA to deploy'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application for GitHub Pages
        run: npm run build

      - name: Validate Production Build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated!"
            exit 1
          fi
          if grep -qE "/src/|main\.tsx" dist/index.html; then
            echo "ERROR: dist/index.html contains development references (/src/ or main.tsx)!"
            exit 1
          fi
          echo "SUCCESS: Production build validated. dist/index.html contains no /src/ or main.tsx references."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
